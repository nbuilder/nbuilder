name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
      - '*.*.*'
      - '*.*.*.*'

env:
  CONFIGURATION: Release
  
jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.set-version.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Extract version from tag
      id: set-version
      run: |
        TAG_NAME=${GITHUB_REF#refs/tags/}
        VERSION=${TAG_NAME#v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Package version: $VERSION"
      
    - name: Setup .NET and restore
      uses: ./.github/actions/setup-dotnet
      
    - name: Build (Release)
      run: dotnet build --no-restore --configuration ${{ env.CONFIGURATION }} /p:AssemblyVersion=${{ steps.set-version.outputs.version }} /p:ProductVersion=${{ steps.set-version.outputs.version }}
      
    - name: Create NuGet package
      run: dotnet pack src/FizzWare.NBuilder/Fizzware.NBuilder.csproj --no-build --configuration ${{ env.CONFIGURATION }} /p:PackageVersion=${{ steps.set-version.outputs.version }} --output ./artifacts
      
    - name: Upload NuGet package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: ./artifacts/*.nupkg
  
  test:
    runs-on: ubuntu-latest
    needs: build-and-pack
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET and restore
      uses: ./.github/actions/setup-dotnet
      
    - name: Build (Debug for coverage)
      run: dotnet build --no-restore --configuration Debug
      
    - name: Run tests with coverage
      uses: ./.github/actions/test-with-coverage
      with:
        codecov-token: ${{ secrets.CODECOV_TOKEN }}
  
  publish:
    runs-on: ubuntu-latest
    needs: [build-and-pack, test]
    
    steps:
    - name: Download NuGet package artifact
      uses: actions/download-artifact@v4
      with:
        name: nuget-package
        path: ./artifacts
      
    - name: Publish to GitHub Packages
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate
      
    - name: Publish to NuGet.org (when API key available)
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        if [ -n "$NUGET_API_KEY" ]; then
          dotnet nuget push ./artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        else
          echo "NUGET_API_KEY not set, skipping NuGet.org publish"
        fi
      continue-on-error: true
