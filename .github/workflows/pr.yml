name: PR Build

on:
  pull_request:

env:
  CONFIGURATION: Release
  
jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET and restore
      uses: ./.github/actions/setup-dotnet
      
    - name: Build (Release)
      run: dotnet build --no-restore --configuration ${{ env.CONFIGURATION }} /p:AssemblyVersion=${{ github.run_number }} /p:ProductVersion=${{ github.run_number }}
      
    - name: Create NuGet package
      run: dotnet pack src/FizzWare.NBuilder/Fizzware.NBuilder.csproj --no-build --configuration ${{ env.CONFIGURATION }} /p:PackageVersion=${{ github.run_number }}-pr-${{ github.event.pull_request.number }} --output ./artifacts
      
    - name: Upload NuGet package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: ./artifacts/*.nupkg
  
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET and restore
      uses: ./.github/actions/setup-dotnet
      
    - name: Build (Debug for coverage)
      run: dotnet build --no-restore --configuration Debug
      
    - name: Run tests with coverage
      uses: ./.github/actions/test-with-coverage
      with:
        codecov-token: ${{ secrets.CODECOV_TOKEN }}
  
  publish:
    runs-on: ubuntu-latest
    needs: [build-and-pack, test]
    
    steps:
    - name: Download NuGet package artifact
      uses: actions/download-artifact@v4
      with:
        name: nuget-package
        path: ./artifacts
      
    - name: Publish to GitHub Packages
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate
